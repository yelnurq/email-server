# Controlled test symbols (V4 §127): deterministic classification hooks for
# E2E — production mail never carries these markers.
#   X-PLATFORM-JUNK-TEST in the subject → score 8 → add_header → Junk
PLATFORM_JUNK_TEST {
  type = "header";
  header = "Subject";
  regexp = true;
  map = "file:///etc/rspamd/local.d/maps/junk_test.map";
  score = 8.0;
  description = "Controlled junk-classification test marker";
}
