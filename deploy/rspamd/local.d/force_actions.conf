# Deterministic overrides on top of the score model (V4 §47, ADR-004):
#  - a positive malware detection always rejects, whatever the total score;
#  - an unavailable scanner defers (451) instead of letting unscanned mail
#    through or bouncing it permanently.
rules {
  MALWARE_REJECT {
    action = "reject";
    expression = "CLAM_VIRUS";
    message = "Message rejected: malware detected";
    require_action = ["no action", "greylist", "add header", "soft reject"];
  }
  AV_UNAVAILABLE_DEFER {
    action = "soft reject";
    expression = "CLAM_VIRUS_FAIL";
    message = "Malware scanner temporarily unavailable, try again later";
    require_action = ["no action", "greylist", "add header"];
  }
}
