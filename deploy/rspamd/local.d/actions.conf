# Score thresholds (V4 §40): what each verdict means downstream.
#   add_header → the mail core files the message into Junk
#   reject     → refused at SMTP with a 5xx (never accept-and-drop, §66)
# Greylisting is disabled: retry-based delays are hostile to transactional
# mail and meaningless in the controlled environment.
reject = 15;
add_header = 6;
greylist = null;
