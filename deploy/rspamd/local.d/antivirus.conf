# ClamAV integration (V4 §44-46): every message's MIME parts are streamed
# to clamd. A detection adds the CLAM_VIRUS symbol whose score is far above
# the reject threshold, so infected inbound mail is refused at SMTP —
# documented failure policy lives in docs/adr/ADR-004.
clamav {
  action = "reject";
  message = "Message rejected: malware detected (${virus})";
  symbol = "CLAM_VIRUS";
  type = "clamav";
  log_clean = true;
  servers = "clamav:3310";
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  # ClamAV unreachable ⇒ the symbol CLAM_VIRUS_FAIL is set and the message
  # is deferred by the force_actions rule below (fail-closed for scanning,
  # ADR-004): a temporary 4xx keeps mail retryable, never silently unscanned.
  patterns_fail {
    CLAM_VIRUS_FAIL = "/^CLAM_VIRUS_FAIL/";
  }
}
