# Mail Platform — local development infrastructure (Phase 1).
#
# All infrastructure runs as Linux containers so the same file works on
# Docker Desktop (Windows/WSL2) today and on Linux Docker Engine later.
# Host ports are shifted (5433/6380) to avoid clashing with natively
# installed PostgreSQL/Memurai on the development machine; override via .env.

name: mail-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailplatform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailplatform_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mailplatform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailplatform} -d ${POSTGRES_DB:-mailplatform}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mailplatform-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: mailplatform-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mailplatform-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Mail core (ADR-001): SMTP submission/relay, IMAP and JMAP. The Go control
  # plane provisions domains/accounts through the management API on :8080
  # (host 8180). Host ports for mail protocols are shifted to unprivileged
  # numbers for local development.
  stalwart:
    # Pinned: v0.13 uses the documented TOML configuration with env macros
    # and the /api/principal management API. v0.16+ switched to an
    # interactive bootstrap wizard with JSON config, which breaks
    # reproducible provisioning-from-file; revisit when automating its setup
    # API is documented.
    image: stalwartlabs/stalwart:v0.13.4
    container_name: mailplatform-stalwart
    environment:
      STALWART_ADMIN_SECRET: ${STALWART_ADMIN_PASSWORD:-stalwart_dev_admin}
      STALWART_MASTER_SECRET: ${STALWART_MASTER_PASSWORD:-stalwart_dev_master}
    ports:
      - "${STALWART_SMTP_PORT:-2525}:25"
      - "${STALWART_SUBMISSION_PORT:-1587}:587"
      - "${STALWART_SUBMISSIONS_PORT:-1465}:465"
      - "${STALWART_IMAP_PORT:-1143}:143"
      - "${STALWART_IMAPS_PORT:-1993}:993"
      - "${STALWART_HTTP_PORT:-8180}:8080"
    volumes:
      - stalwartdata:/opt/stalwart
      - ./deploy/stalwart/config.toml:/opt/stalwart/etc/config.toml:ro
    healthcheck:
      # The v0.13 image has no curl/wget; bash /dev/tcp + a raw HTTP request
      # against the liveness endpoint works with what the image ships.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /healthz/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
  stalwartdata:
