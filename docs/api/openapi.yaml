openapi: 3.0.3
info:
  title: Mail Platform Email API
  version: "1.0"
  description: |
    Developer Email API of the Mail Platform. Authenticated with API keys
    (`Authorization: Bearer mpk_...`) issued in the Admin Portal. Sends are
    asynchronous: the API returns `202 Accepted` with a stable `message_id`;
    delivery progress is available via the message and events endpoints.

    This document covers the public developer surface only. The session-based
    webmail/admin API is documented in README.md and is not a public contract.
servers:
  - url: http://localhost:8080/api/v1
security:
  - apiKey: []
paths:
  /emails:
    post:
      summary: Send an email
      description: |
        Accepts one message for delivery. `from` must be an active mailbox of
        the API key's organization. Supports the `Idempotency-Key` header:
        replaying a byte-identical request with the same key returns the
        original `message_id` with `replayed: true` (200); reusing a key with
        a different payload returns `409 IDEMPOTENCY_CONFLICT`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRequest" }
      responses:
        "202":
          description: Accepted for delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string, example: msg_fnqeo7sdbqbsymwho6zzc3fo6hekwnm7 }
        "200":
          description: Idempotent replay of a previously accepted request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string }
                  replayed: { type: boolean, example: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422":
          description: from is not an active mailbox of the organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /emails/batch:
    post:
      summary: Send up to 50 emails
      description: Per-item results; no Idempotency-Key support on batches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 50
              items: { $ref: "#/components/schemas/SendRequest" }
      responses:
        "202":
          description: Batch processed (individual items may have failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  total: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id: { type: string }
                        error: { type: string }
  /emails/{id}:
    get:
      summary: Message status
      description: Requires the `emails.read` scope. Scoped to the key's organization.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Message status with per-recipient outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string }
                  from: { type: string }
                  subject: { type: string }
                  status:
                    type: string
                    enum: [accepted, processing, delivered, partially_delivered, failed, quarantined]
                  created_at: { type: string }
                  recipients:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [to, cc, bcc] }
                        address: { type: string }
                        status: { type: string, enum: [pending, delivered, failed, quarantined] }
                        error: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /emails/{id}/events:
    get:
      summary: Delivery event log
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ordered event history
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [email.accepted, email.delivered_local, email.failed, email.quarantined]
                        detail: { type: object }
                        created_at: { type: string }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key issued in the Admin Portal (format mpk_...).
  schemas:
    SendRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Active mailbox address of the key's organization.
          example: noreply@company.test
        to:
          type: array
          items: { type: string }
          minItems: 1
        cc:
          type: array
          items: { type: string }
        bcc:
          type: array
          items: { type: string }
        subject: { type: string, maxLength: 500 }
        text: { type: string, description: Plain-text body (max 1 MiB) }
        html: { type: string, description: HTML body (max 1 MiB, sanitized on render) }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: IDEMPOTENCY_CONFLICT }
            message: { type: string }
            request_id: { type: string }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
